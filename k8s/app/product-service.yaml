apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: product-service
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/product-service:latest
          command: ["sh", "-c", "exec java ${JAVA_OPTS} -jar /app.jar"]
          ports:
            - containerPort: 6067
            - containerPort: 6167
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: PRODUCT_SERVICE_PORT
              value: "6067"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            tcpSocket:
              port: 6067
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6067
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: app
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 6067
      targetPort: 6067
    - name: grpc
      port: 6167
      targetPort: 6167
