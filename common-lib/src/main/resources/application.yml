spring:
  # Vẫn giữ exclude DB vì thư viện chung không cần tự kết nối DB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  
  # Khớp lệnh hoàn toàn với Gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8888/realms/iluttmab}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

springdoc:
  oauthflow:
    # Tham số hóa URL để lúc lên VPS, trình duyệt có thể gọi được auth URL
    authorization-url: ${KEYCLOAK_AUTH_URL:http://localhost:8888/realms/iluttmab/protocol/openid-connect/auth}
    token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8888/realms/iluttmab/protocol/openid-connect/token}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:"*"}