apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: file-service
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/file-service:latest
          ports:
            - containerPort: 8084
            - containerPort: 8184
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: FILE_SERVICE_PORT
              value: "8084"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: app
spec:
  selector:
    app: file-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
    - name: grpc
      port: 8184
      targetPort: 8184
