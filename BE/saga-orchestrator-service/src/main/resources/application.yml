server:
  port: ${SAGA_ORCHESTRATOR_PORT:6058}
  servlet:
    context-path: /saga-orchestrator-service

spring:
  application:
    name: saga-orchestrator-service

grpc:
  client:
    user-service:
      address: ${USER_SERVICE_GRPC_ADDRESS:discovery:///USER-SERVICE}
      negotiationType: plaintext
  server:
    port: ${SAGA_ORCHESTRATOR_GRPC_PORT:6158}
  user-service:
    deadline-ms: ${USER_SERVICE_GRPC_DEADLINE_MS:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.tam: DEBUG
  pattern:
    console: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/saga-orchestrator-service.log
    max-size: 10MB
    max-history: 7
