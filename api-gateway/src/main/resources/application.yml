server:
  port: ${SERVER_PORT:6060}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    gateway:
      # [THÊM MỚI] LUẬT CHUNG: Mặc định mọi request qua Gateway chỉ được 100 lần/giây
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
            deny-empty-key: false        # ← THÊM: không deny khi key resolver fail
            empty-key-status-code: 429
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api-gateway/identity-service/**
          filters:
            - StripPrefix=1
            # [THÊM MỚI] Ghi đè luật chung: Siết chặt Identity Service (Chỉ 2 lần/giây để chống spam Login/OTP)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api-gateway/user-service/**
          filters:
            - StripPrefix=1

        # Trả lại tên cho Product (Gánh Product, Inventory, Search)
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api-gateway/product-service/**
          filters:
            - StripPrefix=1

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api-gateway/order-service/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api-gateway/payment-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api-gateway/notification-service/**
          filters:
            - StripPrefix=1
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api-gateway/media-service/**
          filters:
            - StripPrefix=1
        - id: saga-orchestrator-service
          uri: lb://SAGA-ORCHESTRATOR-SERVICE
          predicates:
            - Path=/api-gateway/saga-orchestrator-service/**
          filters:
            - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.server.authorization: DEBUG
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}