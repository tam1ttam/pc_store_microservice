server:
  port: 6072

spring:
  application:
    name: tax-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tax
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka}

grpc:
  server:
    port: ${TAX_SERVICE_GRPC_PORT:6172}
