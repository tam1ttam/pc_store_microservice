syntax = "proto3";

package com.tam.proto.order.v1;

option java_multiple_files = true;
option java_package = "com.tam.proto.order.v1";
option java_outer_classname = "OrderServiceProto";

service OrderService {
  // Tạo đơn hàng mới
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  
  // Lấy danh sách đơn hàng của customer
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  
  // Lấy chi tiết đơn hàng
  rpc GetOrderDetail(GetOrderDetailRequest) returns (OrderResponse);
  
  // Lấy đơn hàng theo trạng thái
  rpc GetOrdersByStatus(GetOrdersByStatusRequest) returns (GetOrdersResponse);
  
  // Cập nhật trạng thái đơn hàng
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);
  
  // Xóa đơn hàng
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

// ==================== ENUMS ====================

enum OrderStatus {
  ORDER_STATUS_DELIVERING = 0;   // Đang giao hàng
  ORDER_STATUS_DELIVERED = 1;    // Đã giao hàng
  ORDER_STATUS_CANCELLED = 2;    // Đã hủy
}

enum PaymentStatus {
  PAYMENT_STATUS_CREATED = 0;
  PAYMENT_STATUS_APPROVED = 1;
  PAYMENT_STATUS_FAILED = 2;
  PAYMENT_STATUS_CANCELLED = 3;
}

// ==================== REQUEST MESSAGES ====================

message CreateOrderRequest {
  string customerId = 1;
  string shipAddress = 2;
  repeated CartItem items = 3;
  double totalPrice = 4;
  string orderDate = 5;
  string isPaid = 6;
  string orderStatus = 7;
}

message GetOrdersRequest {
  string customerId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

message GetOrderDetailRequest {
  string orderId = 1;
}

message GetOrdersByStatusRequest {
  string customerId = 1;
  string status = 2;
}

message UpdateOrderStatusRequest {
  string orderId = 1;
  string status = 2;
}

message CancelOrderRequest {
  string orderId = 1;
}

// ==================== CART ITEM ====================

message CartItem {
  string productId = 1;
  string productName = 2;
  double productPrice = 3;
  int32 quantity = 4;
}

// ==================== RESPONSE MESSAGES ====================

message OrderResponse {
  string id = 1;
  string customerId = 2;
  string shipAddress = 3;
  string orderDate = 4;
  string currency = 5;
  repeated CartItem items = 6;
  double totalPrice = 7;
  bool isPaid = 8;
  OrderStatus orderStatus = 9;
}

message GetOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 totalPages = 2;
  int32 currentPage = 3;
  int64 totalItems = 4;
}

message CancelOrderResponse {
  bool success = 1;
  string message = 2;
  string orderId = 3;
}
