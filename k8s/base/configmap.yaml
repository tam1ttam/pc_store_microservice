apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
data:
  # Eureka
  EUREKA_URI: "http://discovery-service.app.svc.cluster.local:6059/eureka/"
  EUREKA_HOSTNAME: "discovery-service.app.svc.cluster.local"

  # Infrastructure — cluster-internal DNS
  REDIS_HOST: "redis.infra.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.infra.svc.cluster.local:9092"
  ELASTICSEARCH_URIS: "http://elasticsearch.infra.svc.cluster.local:9200"
  ELASTICSEARCH_USERNAME: "elastic"

  # MySQL (identity-service)
  IDENTITY_DB_HOST: "mysql.infra.svc.cluster.local"
  IDENTITY_DB_PORT: "3306"
  IDENTITY_DB_NAME: "identityservice"
  IDENTITY_DB_USER: "root"
  MONGO_ROOT_USER: "root"

  # AWS S3
  AWS_REGION: "ap-southeast-2"
  AWS_S3_BUCKET: "maichitam22644901"
  CLOUDINARY_CLOUD_NAME: "social-example-project-vutran"
  CLOUDINARY_API_KEY: "938536251322765"

  # Gemini
  GEMINI_API_MODEL: "gemini-2.0-flash"

  # CORS — nip.io staging domain
  CORS_ALLOWED_ORIGINS: "http://192.168.179.50.nip.io"
  ALLOWED_ORIGINS: "http://192.168.179.50.nip.io"

  # Logging
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_COM_TAM: "WARN"

  # JVM
  JAVA_OPTS: "-Xms128m -Xmx256m"

  # K8s-specific health probes (liveness/readiness endpoints)
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"

  # Disable external-dependency health indicators so liveness probe only checks app itself
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
  MANAGEMENT_HEALTH_DISCOVERYCLIENT_ENABLED: "false"
