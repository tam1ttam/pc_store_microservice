apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api-gateway
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/api-gateway:latest
          ports:
            - containerPort: 6060
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 6060
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 6060
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: app
spec:
  selector:
    app: api-gateway
  ports:
    - port: 6060
      targetPort: 6060
