apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: manager
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/manager:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: web
spec:
  selector:
    app: manager
  ports:
    - port: 80
      targetPort: 80
