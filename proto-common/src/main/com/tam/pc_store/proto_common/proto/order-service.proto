syntax = "proto3";

package tam.pc_store.order.v1;

option java_multiple_files = true;
option java_package = "iuh.fit.pc_store.grpc.order.v1";
option java_outer_classname = "OrderServiceProto";

service OrderService {
  rpc PreviewOrder(PreviewOrderRequest) returns (OrderPreviewResponse);
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc GetOrderDetail(GetOrderDetailRequest) returns (OrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
}

// Enums

enum OrderStatus {
  ORDER_STATUS_PENDING = 0;   // Khớp với PENDING
  ORDER_STATUS_SHIPPING = 1;  // Khớp với SHIPPING
  ORDER_STATUS_SHIPPED = 2;   // Khớp với SHIPPED
  ORDER_STATUS_CANCELLED = 3; // Khớp với CANCELLED
  ORDER_STATUS_COMPLETED = 4; // Khớp với COMPLETED
}

enum PaymentMethod {
  PAYMENT_METHOD_COD = 0;
  PAYMENT_METHOD_VNPAY = 1;
  PAYMENT_METHOD_MOMO = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNPAID = 0;
  PAYMENT_STATUS_PAID = 1;
  PAYMENT_STATUS_REFUNDED = 2;
}

// Request Messages

message PreviewOrderRequest {
  string user_id = 1;
  string shipping_address = 2;
  PaymentMethod payment_method = 3;
  string voucher_code = 4;
  repeated int32 item_ids = 5;
}

message CreateOrderRequest {
  string user_id = 1;
  string shipping_address = 2;
  PaymentMethod payment_method = 3;
  string voucher_code = 4;
  string note = 5;
  repeated int32 item_ids = 6;
}

message GetOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetOrderDetailRequest {
  string order_id = 1;
  string user_id = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

// Response Messages

message OrderPreviewResponse {
  double subtotal = 1;
  double shipping_fee = 2;
  double discount = 3;
  double total = 4;
  repeated ItemPreview items = 5;

  message ItemPreview {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    double price = 4;
  }
}

message OrderResponse {
  string order_id = 1;
  string user_id = 2;
  OrderStatus status = 3;
  PaymentMethod payment_method = 4;
  PaymentStatus payment_status = 5;
  string shipping_address = 6;
  string note = 7;
  double total_price = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  repeated ItemInfo items = 11;
  repeated VoucherInfo vouchers = 12;

  message ItemInfo {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    double price = 4;
  }

  message VoucherInfo {
    string voucher_id = 1;
    string code = 2;
    double discount_amount = 3;
    double discount_percent = 4;
  }
}

message GetOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
  int64 total_items = 4;
}
