server:
  port: ${FILE_SERVICE_PORT:8084}
  servlet:
    context-path: /file-service

spring:
  application:
    name: file-service
  jmx:
    enabled: false
  data:
    mongodb:
      uri: ${FILE_MONGO_URI:mongodb://localhost:27017/file-service}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6002}
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-southeast-1}
    s3:
      bucket: ${AWS_S3_BUCKET:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ss}
  api-key: ${CLOUDINARY_API_KEY:ss}
  api-secret: ${CLOUDINARY_API_SECRET:ss}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-1.5-flash}

app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:./uploads}
    download-prefix: ${FILE_DOWNLOAD_PREFIX:http://localhost:8084/file/media/download/}
  security:
    permit-all-endpoints:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/health
    allowed-origins:
      - ${ALLOWED_ORIGINS:http://localhost:3003,http://localhost:3004}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.tam: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/file-service.log
    max-size: 10MB
    max-history: 7
