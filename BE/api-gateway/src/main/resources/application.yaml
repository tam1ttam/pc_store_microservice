server:
  port: ${API_GATEWAY_PORT:6060}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: api-gateway
  jmx:
    enabled: false
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6002}
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
            deny-empty-key: false
            empty-key-status-code: 429
        - name: CircuitBreaker
          args:
            name: globalCB
            fallbackUri: forward:/fallback/unavailble
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api-gateway/identity-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api-gateway/user-service/**
          filters:
            - StripPrefix=1
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api-gateway/chat-service/**
          filters:
            - StripPrefix=1

        - id: file-service
          uri: lb://FILE-SERVICE
          predicates:
            - Path=/api-gateway/file-service/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api-gateway/product-service/**
          filters:
            - StripPrefix=1

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api-gateway/order-service/**
          filters:
            - StripPrefix=1

        - id: discovery-eureka
          uri: ${EUREKA_BASE_URL:http://localhost:6059}
          predicates:
            - Path=/api-gateway/eureka/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api-gateway/payment-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api-gateway/notification-service/**
          filters:
            - StripPrefix=1

        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api-gateway/media-service/**
          filters:
            - StripPrefix=1

        - id: saga-orchestrator-service
          uri: lb://SAGA-ORCHESTRATOR-SERVICE
          predicates:
            - Path=/api-gateway/saga-orchestrator-service/**
          filters:
            - StripPrefix=1

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api-gateway/ai-service/**
          filters:
            - StripPrefix=1



#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3005,http://localhost:3003,http://localhost:3004}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    com.tam: ${LOGGING_LEVEL_COM_TAM:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{ISO8601} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      globalCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      globalCB:
        timeout-duration: 60s
      identityServiceCB:
        timeout-duration: 5s