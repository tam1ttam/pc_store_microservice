server:
  port: ${SERVER_PORT:6065}
  servlet:
    context-path: /order-service

spring:
  main:
    # Cho phép ghi đè Bean nếu bị trùng tên
    allow-bean-definition-overriding: true
  application:
    name: order-service

  # Bảo mật chuẩn chỉ
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}

  # Database 'order' giờ sẽ chứa cả bảng orders, order_items, và promotions, vouchers...
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}
    permit-all-endpoints:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/health
    allowed-origins:
      - ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka}
  instance:
    prefer-ip-address: true

grpc:
  server:
    port: ${ORDER_SERVICE_GRPC_PORT:6165}
logging:
  level:
    root: INFO
    com.tam: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/order-service.log
    max-size: 10MB
    max-history: 7