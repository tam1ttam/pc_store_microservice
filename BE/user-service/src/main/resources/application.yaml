server:
  port: ${USER_SERVICE_PORT:6063}
  servlet:
    context-path: /user-service

spring:
  application:
    name: user-service
  jmx:
    enabled: false
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: ${USER_MONGO_URI:mongodb://localhost:27017/user-service}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6002}
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "*"
        "[spring.json.type.mapping]": "com.devteria.identity.event.UserDeletedEvent:com.tam.profile.kafka.event.UserDeletedEvent"

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

app:
  security:
    permit-all-endpoints:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/health
      - /internal/users
      - /internal/users/**
    allowed-origins:
      - ${ALLOWED_ORIGINS:http://localhost:3003,http://localhost:3004}
  services:
    file: ${FILE_SERVICE_URL:lb://FILE-SERVICE/file-service}

grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT:6163}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.tam: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 7
management:
  endpoints:
    web:
      exposure:
        include: beans