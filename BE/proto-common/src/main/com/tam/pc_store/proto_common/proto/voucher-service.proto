syntax = "proto3";

package tam.pc_store.voucher.v1;

option java_multiple_files = true;
option java_package = "iuh.fit.pc_store.grpc.voucher.v1";
option java_outer_classname = "VoucherServiceProto";

service VoucherService {
  rpc CreateVoucher(CreateVoucherRequest) returns (VoucherResponse);
  rpc GetVoucher(GetVoucherRequest) returns (VoucherResponse);
  rpc GetActiveVouchers(GetActiveVouchersRequest) returns (GetActiveVouchersResponse);
  rpc UpdateVoucher(UpdateVoucherRequest) returns (VoucherResponse);
  rpc DeleteVoucher(DeleteVoucherRequest) returns (DeleteVoucherResponse);
  rpc ValidateVoucher(ValidateVoucherRequest) returns (VoucherResponse);
  rpc AttachVoucherToOrder(AttachVoucherToOrderRequest) returns (AttachVoucherResponse);
  rpc RemoveVoucherFromOrder(RemoveVoucherFromOrderRequest) returns (RemoveVoucherResponse);
}

// Enums

enum VoucherType {
  VOUCHER_TYPE_STACKABLE = 0;
  VOUCHER_TYPE_NON_STACKABLE = 1;
}

// Request Messages

message CreateVoucherRequest {
  string code = 1;
  string description = 2;
  double discount_amount = 3;
  double discount_percent = 4;
  int32 max_usage = 5;
  int64 expired_at = 6;
  VoucherType voucher_type = 7;
}

message GetVoucherRequest {
  string voucher_id = 1;
}

message GetActiveVouchersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message UpdateVoucherRequest {
  string voucher_id = 1;
  string code = 2;
  string description = 3;
  double discount_amount = 4;
  double discount_percent = 5;
  int32 max_usage = 6;
  int64 expired_at = 7;
  VoucherType voucher_type = 8;
}

message DeleteVoucherRequest {
  string voucher_id = 1;
}

message ValidateVoucherRequest {
  string code = 1;
}

message AttachVoucherToOrderRequest {
  string order_id = 1;
  string voucher_code = 2;
}

message RemoveVoucherFromOrderRequest {
  string order_id = 1;
  string voucher_id = 2;
}

// Response Messages

message VoucherResponse {
  string voucher_id = 1;
  string code = 2;
  string description = 3;
  double discount_amount = 4;
  double discount_percent = 5;
  int32 max_usage = 6;
  int32 used_count = 7;
  int64 expired_at = 8;
  bool is_active = 9;
  VoucherType voucher_type = 10;
}

message GetActiveVouchersResponse {
  repeated VoucherResponse vouchers = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
  int64 total_items = 4;
}

message DeleteVoucherResponse {
  bool success = 1;
  string message = 2;
}

message AttachVoucherResponse {
  bool success = 1;
  string order_id = 2;
  repeated VoucherInfo vouchers = 3;

  message VoucherInfo {
    string voucher_id = 1;
    string code = 2;
    double discount_amount = 3;
    double discount_percent = 4;
  }
}

message RemoveVoucherResponse {
  bool success = 1;
  string order_id = 2;
  repeated VoucherInfo vouchers = 3;

  message VoucherInfo {
    string voucher_id = 1;
    string code = 2;
    double discount_amount = 3;
    double discount_percent = 4;
  }
}
