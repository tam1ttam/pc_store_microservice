apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: discovery-service
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/discovery-service:latest
          command: ["sh", "-c", "exec java ${JAVA_OPTS} -jar /app.jar"]
          ports:
            - containerPort: 6059
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 6059
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6059
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: app
spec:
  selector:
    app: discovery-service
  ports:
    - port: 6059
      targetPort: 6059
