server:
  port: ${SERVER_PORT:6073}
  servlet:
    context-path: /user-service

spring:
  application:
    name: user-service
  main:
    # Cho phép ghi đè Bean nếu bị trùng tên
    allow-bean-definition-overriding: true
  datasource:
    # Database userservice giờ sẽ chứa thêm bảng favourites
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/userservice
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}

api:
  prefix: ${API_PREFIX:/api/v1}

app:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/iluttmab}
    permit-all-endpoints:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/health
    allowed-origins:
      - ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT:6173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG