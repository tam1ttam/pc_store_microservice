apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: order-service
          image: registry.gitlab.com/tam1ttam-group/pc_store_microservice/order-service:latest
          command: ["sh", "-c", "exec java ${JAVA_OPTS} -jar /app.jar"]
          ports:
            - containerPort: 6065
            - containerPort: 6165
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
            - name: ORDER_SERVICE_PORT
              value: "6065"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 6065
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6065
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: app
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 6065
      targetPort: 6065
    - name: grpc
      port: 6165
      targetPort: 6165
