syntax = "proto3";

package pc_store.product.v1;

option java_multiple_files = true;
option java_package = "iuh.fit.pc_store.grpc.product.v1";
option java_outer_classname = "ProductServiceProto";

service ProductService {
  // Lấy thông tin chi tiết sản phẩm
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  
  // Lấy nhiều sản phẩm theo danh sách ID
  rpc GetProductsByIds(GetProductsByIdsRequest) returns (GetProductsByIdsResponse);
  
  // Kiểm tra tính khả dụng của sản phẩm
  rpc CheckProductAvailability(CheckProductAvailabilityRequest) returns (CheckProductAvailabilityResponse);
  
  // Lấy sản phẩm theo category
  rpc GetProductsByCategory(GetProductsByCategoryRequest) returns (GetProductsByCategoryResponse);
  
  // Lấy sản phẩm nổi bật
  rpc GetFeaturedProducts(GetFeaturedProductsRequest) returns (GetFeaturedProductsResponse);
  
  // Kiểm tra xem sản phẩm có thể đặt hàng
  rpc IsProductAllowedToOrder(IsProductAllowedToOrderRequest) returns (IsProductAllowedToOrderResponse);
}

message GetProductRequest {
  string productId = 1;
}

message GetProductResponse {
  string productId = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string specification = 5;
  double price = 6;
  double averageStar = 7;
  string thumbnailUrl = 8;
  repeated string imageUrls = 9;
  string brandName = 10;
  string shortDescription = 11;
  bool isAllowedToOrder = 12;
  bool isPublished = 13;
  bool isFeatured = 14;
  bool hasOptions = 15;
  CategoryInfo category = 16;
  repeated ProductAttributeInfo attributes = 17;
}

message GetProductsByIdsRequest {
  repeated string productIds = 1;
}

message GetProductsByIdsResponse {
  repeated ProductDetail products = 1;
}

message ProductDetail {
  string productId = 1;
  string name = 2;
  string slug = 3;
  double price = 4;
  double averageStar = 5;
  string thumbnailUrl = 6;
  bool isPublished = 7;
  bool isFeatured = 8;
}

message CheckProductAvailabilityRequest {
  string productId = 1;
  int32 quantity = 2;
}

message CheckProductAvailabilityResponse {
  bool available = 1;
  string message = 2;
  string productId = 3;
  int32 requestedQuantity = 4;
}

message GetProductsByCategoryRequest {
  string categoryId = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetProductsByCategoryResponse {
  repeated ProductDetail products = 1;
  int32 totalElements = 2;
  int32 totalPages = 3;
  int32 currentPage = 4;
  int32 pageSize = 5;
}

message GetFeaturedProductsRequest {
  int32 limit = 1;
}

message GetFeaturedProductsResponse {
  repeated ProductDetail products = 1;
}

message IsProductAllowedToOrderRequest {
  string productId = 1;
}

message IsProductAllowedToOrderResponse {
  bool allowed = 1;
  bool isPublished = 2;
  bool isActive = 3;
  string message = 4;
}

message CategoryInfo {
  string categoryId = 1;
  string categoryName = 2;
  string slug = 3;
}

message ProductAttributeInfo {
  string attributeId = 1;
  string attributeName = 2;
  string attributeValue = 3;
  string groupName = 4;
}
