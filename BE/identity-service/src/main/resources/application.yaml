server:
  port: 6062
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service
  datasource:
    # Tham số hóa Database
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/identityservice
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in seconds

app:
  prefix: ${API_PREFIX:/api/v1}
  context-path: ${server.servlet.context-path:/identity-service}
  services:
    profile: http://localhost:8081/profile
# Thêm vào cuối file
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true