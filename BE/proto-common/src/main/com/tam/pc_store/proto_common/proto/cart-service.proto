syntax = "proto3";

package com.tam.proto.cart.v1;

option java_multiple_files = true;
option java_package = "com.tam.proto.cart.v1";
option java_outer_classname = "CartServiceProto";

service CartService {
  rpc GetCart(GetCartRequest) returns (CartResponse);
  rpc CreateCart(CreateCartRequest) returns (CreateCartResponse);
  rpc AddToCart(AddToCartRequest) returns (CartResponse);
  rpc UpdateCartItem(UpdateCartItemRequest) returns (CartResponse);
  rpc RemoveFromCart(RemoveFromCartRequest) returns (CartResponse);
  rpc RemoveMultipleFromCart(RemoveMultipleFromCartRequest) returns (CartResponse);
  rpc EmptyCart(EmptyCartRequest) returns (EmptyCartResponse);
}

// Request/Response Messages

message GetCartRequest {
  string user_id = 1;
}

message CreateCartRequest {
  string user_id = 1;
}

message CreateCartResponse {
  bool success = 1;
}

message AddToCartRequest {
  string user_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double price = 4;
  string product_name = 5;
  string thumbnail = 6;
}

message UpdateCartItemRequest {
  string user_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
}

message RemoveFromCartRequest {
  string user_id = 1;
  int32 item_id = 2;
}

message RemoveMultipleFromCartRequest {
  string user_id = 1;
  repeated int32 item_ids = 2;
}

message EmptyCartRequest {
  string user_id = 1;
}

message EmptyCartResponse {
  bool success = 1;
  string message = 2;
}

// Response Messages

message CartResponse {
  string cart_id = 1;
  string user_id = 2;
  repeated CartItemResponse items = 3;
  double total_price = 4;
  int32 total_items = 5;
}

message CartItemResponse {
  int32 item_id = 1;
  string product_id = 2;
  string product_name = 3;
  string thumbnail = 4;
  int32 quantity = 5;
  double price = 6;
  double subtotal = 7;
}
