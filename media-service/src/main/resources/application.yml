server:
  port: 6064

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://localhost:5432/media
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false

  h2:
    console:
      enabled: false

file:
  directory: ${FILE_DIRECTORY:/tmp/media-files}

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka}

grpc:
  server:
    port: ${MEDIA_SERVICE_GRPC_PORT:6164}
