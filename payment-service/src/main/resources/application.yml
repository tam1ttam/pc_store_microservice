server:
  port: 6066

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka}

grpc:
  server:
    port: ${PAYMENT_SERVICE_GRPC_PORT:6166}

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
