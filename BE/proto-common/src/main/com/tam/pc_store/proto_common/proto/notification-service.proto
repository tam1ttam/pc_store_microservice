syntax = "proto3";

package com.tam.proto.notification.v1;

option java_multiple_files = true;
option java_package = "com.tam.proto.notification.v1";
option java_outer_classname = "NotificationServiceProto";

service NotificationService {
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc GetUserNotifications(GetUserNotificationsRequest) returns (GetUserNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
}

message CreateNotificationRequest {
  string user_id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  bool is_system = 5;
  bool action_required = 6;
  string reference_id = 7;
  string reference_type = 8;
}

message CreateNotificationResponse {
  string id = 1;
  bool success = 2;
}

message GetUserNotificationsRequest {
  string user_id = 1;
  bool unread_only = 2;
  int32 page = 3;
  int32 size = 4;
}

message NotificationItem {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  bool is_read = 6;
  bool is_system = 7;
  bool action_required = 8;
  bool action_done = 9;
  string reference_id = 10;
  string reference_type = 11;
  string created_at = 12;
}

message GetUserNotificationsResponse {
  repeated NotificationItem notifications = 1;
  int32 total_unread = 2;
}

message MarkAsReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message MarkAsReadResponse {
  bool success = 1;
}

message GetUnreadCountRequest {
  string user_id = 1;
}

message GetUnreadCountResponse {
  int32 count = 1;
}
