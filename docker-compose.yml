# ==============================================================================
# docker-compose tổng — chạy từ root D:\nhap\nhap_iluttmab\
# docker compose -p iluttmab up -d
# ==============================================================================

services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  mongodb:
    image: mongo:7.0
    container_name: pc-mongodb
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${MONGO_HOST_PORT:-6000}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-123456}
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: pc-mysql
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${MYSQL_HOST_PORT:-6001}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-123456}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME:-identityservice}
      MYSQL_USER: ${IDENTITY_DB_USER:-appuser}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASS:-123456}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASS:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6002}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: pc-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 600M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: pc-elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms256m -Xmx256m}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: pc-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  loki:
    image: grafana/loki:2.9.4
    container_name: pc-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./BE/docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.4
    container_name: pc-promtail
    restart: unless-stopped
    volumes:
      - ./BE/docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M

  grafana:
    image: grafana/grafana:10.4.2
    container_name: pc-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./BE/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  # ============================================================
  # BACKEND SERVICES
  # ============================================================

  discovery-service:
    build:
      context: ./BE/discovery-service
      dockerfile: Dockerfile
    container_name: pc-discovery-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${DISCOVERY_SERVICE_PORT:-6059}:6059"
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6059/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    build:
      context: ./BE/api-gateway
      dockerfile: Dockerfile
    container_name: pc-api-gateway
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${API_GATEWAY_PORT:-6060}:6060"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6060/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  identity-service:
    build:
      context: ./BE/identity-service
      dockerfile: Dockerfile
    container_name: pc-identity-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${IDENTITY_SERVICE_PORT:-6062}:6062"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6062/identity-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  user-service:
    build:
      context: ./BE/user-service
      dockerfile: Dockerfile
    container_name: pc-user-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${USER_SERVICE_PORT:-6063}:6063"
      - "${USER_SERVICE_GRPC_PORT:-6163}:6163"
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6063/user-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  product-service:
    build:
      context: ./BE/product-service
      dockerfile: Dockerfile
    container_name: pc-product-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${PRODUCT_SERVICE_PORT:-6067}:6067"
      - "${PRODUCT_SERVICE_GRPC_PORT:-6167}:6167"
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6067/product-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  order-service:
    build:
      context: ./BE/order-service
      dockerfile: Dockerfile
    container_name: pc-order-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${ORDER_SERVICE_PORT:-6065}:6065"
      - "${ORDER_SERVICE_GRPC_PORT:-6165}:6165"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6065/order-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  chat-service:
    build:
      context: ./BE/chat-service
      dockerfile: Dockerfile
    container_name: pc-chat-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${CHAT_SERVICE_PORT:-8085}:8085"
      - "8099:8099"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/chat-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  file-service:
    build:
      context: ./BE/file-service
      dockerfile: Dockerfile
    container_name: pc-file-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${FILE_SERVICE_PORT:-8084}:8084"
      - "${FILE_SERVICE_GRPC_PORT:-8184}:8184"
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/file-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    build:
      context: ./BE/notification-service
      dockerfile: Dockerfile
    container_name: pc-notification-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-6068}:6068"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6068/notification-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  saga-orchestrator-service:
    build:
      context: ./BE/saga-orchestrator-service
      dockerfile: Dockerfile
    container_name: pc-saga-orchestrator-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${SAGA_ORCHESTRATOR_PORT:-6058}:6058"
      - "${SAGA_ORCHESTRATOR_GRPC_PORT:-6158}:6158"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6058/saga-orchestrator-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ============================================================
  # AI AGENT (Python FastAPI)
  # ============================================================

  ai-service:
    build:
      context: ./BE/agent
      dockerfile: Dockerfile
    container_name: pc-ai-service
    restart: unless-stopped
    env_file: ./BE/.env.development
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:8085/chat-service}
      MONGODB_URI: ${AI_MONGODB_URI:-mongodb://root:${MONGO_ROOT_PASS:-123456}@mongodb:27017/ai-service?authSource=admin}
    volumes:
      - ai_service_data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  # ============================================================
  # FRONTEND (Nginx static)
  # ============================================================

  ui-client:
    build:
      context: ./UI/client
      dockerfile: Dockerfile
    container_name: pc-ui-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3003}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 128M

  ui-manager:
    build:
      context: ./UI/manager
      dockerfile: Dockerfile
    container_name: pc-ui-manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-3004}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 128M

  ui-admin:
    build:
      context: ./UI/admin
      dockerfile: Dockerfile
    container_name: pc-ui-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3005}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  mongodb_data:
  mysql_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  loki_data:
  grafana_data:
  ai_service_data: