syntax = "proto3";

package com.tam.proto.identity.v1;

option java_multiple_files = true;
option java_package = "com.tam.proto.identity.v1";
option java_outer_classname = "IdentityServiceProto";

service IdentityService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse);
  rpc RefreshToken(RefreshRequest) returns (AuthenticateResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc GetAllRoles(GetAllRolesRequest) returns (GetAllRolesResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
}

message AuthenticateRequest {
  string user_name = 1;
  string password = 2;
}

message AuthenticateResponse {
  bool is_authenticated = 1;
  string token = 2;
  int64 expires_in = 3;
}

message IntrospectRequest {
  string token = 1;
}

message IntrospectResponse {
  bool valid = 1;
  string user_name = 2;
  repeated string roles = 3;
}

message RefreshRequest {
  string token = 1;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
}

message RoleResponse {
  string id = 1;
  string name = 2;
  string description = 3;
}

message GetAllRolesRequest {
}

message GetAllRolesResponse {
  repeated RoleResponse roles = 1;
}

message DeleteRoleRequest {
  string name = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}
