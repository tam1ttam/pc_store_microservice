server:
  port: ${SERVER_PORT:6073}
  servlet:
    context-path: /user-service

spring:
  application:
    name: user-service
  datasource:
    # Đã tham số hóa DB để mốt lên Docker không phải khóc
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/userservice
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # CÁI NÀY LÀ CỨU CÁNH CHÍ MẠNG: Khớp nối bảo mật với toàn hệ thống
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8888/realms/iluttmab}

api:
  prefix: ${API_PREFIX:/api/v1}

grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT:6173}

eureka:
  client:
    service-url:
      # Đổi thành EUREKA_URI cho đồng bộ với các service khác
      defaultZone: ${EUREKA_URI:http://localhost:6059/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html