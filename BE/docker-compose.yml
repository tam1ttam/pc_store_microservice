services:

  # ============================================================
  # DATABASE — MongoDB  (host port ${MONGO_HOST_PORT:-6000})
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-6000}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-123456}
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # DATABASE — MySQL  (host port ${MYSQL_HOST_PORT:-6001})
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-6001}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-123456}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME:-identityservice}
      MYSQL_USER: ${IDENTITY_DB_USER:-appuser}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASS:-123456}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASS:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # CACHE — Redis  (host port ${REDIS_HOST_PORT:-6002})
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6002}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # MESSAGE BROKER — Kafka  (host port ${KAFKA_EXTERNAL_PORT:-9094})
  # Internal PLAINTEXT listener: kafka:9092
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 600M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # SEARCH — Elasticsearch  (host port ${ELASTICSEARCH_PORT:-9200})
  # ============================================================
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms256m -Xmx256m}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # TRACING — Zipkin  (port ${ZIPKIN_PORT:-9411})
  # ============================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  # ============================================================
  # LOGGING — Loki  (port ${LOKI_PORT:-3100})
  # ============================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # LOGGING — Promtail
  # ============================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M

  # ============================================================
  # VISUALIZATION — Grafana  (port ${GRAFANA_PORT:-3000})
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  # ============================================================
  # SPRING BOOT SERVICES
  # Chạy: docker-compose --env-file .env.development up -d
  # Build JAR trước:
  #   cd common-lib    && mvn install -DskipTests
  #   cd proto-common  && mvn install -DskipTests
  #   cd {service}     && mvn package -DskipTests  (từng service)
  # ============================================================

  # ── Discovery / Eureka  (:6059) ──────────────────────────────
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${DISCOVERY_SERVICE_PORT:-6059}:6059"
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6059/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── API Gateway  (:6060) ──────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${API_GATEWAY_PORT:-6060}:6060"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6060/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Identity Service  (:6062 | MySQL) ────────────────────────
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${IDENTITY_SERVICE_PORT:-6062}:6062"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6062/identity-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── User Service  (:6063 | gRPC :6163 | MongoDB) ─────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${USER_SERVICE_PORT:-6063}:6063"
      - "${USER_SERVICE_GRPC_PORT:-6163}:6163"
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6063/user-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Product Service  (:6067 | gRPC :6167 | MongoDB + ES) ─────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${PRODUCT_SERVICE_PORT:-6067}:6067"
      - "${PRODUCT_SERVICE_GRPC_PORT:-6167}:6167"
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6067/product-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Order Service  (:6065 | gRPC :6165 | MongoDB) ────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${ORDER_SERVICE_PORT:-6065}:6065"
      - "${ORDER_SERVICE_GRPC_PORT:-6165}:6165"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6065/order-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Chat Service  (:8085 | Socket.IO :8099 | MongoDB) ────────
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${CHAT_SERVICE_PORT:-8085}:8085"
      - "8099:8099"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/chat-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── File Service  (:8084 | gRPC :8184 | MongoDB + S3) ────────
  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: file-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${FILE_SERVICE_PORT:-8084}:8084"
      - "${FILE_SERVICE_GRPC_PORT:-8184}:8184"
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/file-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Notification Service  (:6068 | MongoDB) ──────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-6068}:6068"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6068/notification-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Saga Orchestrator  (:6058 | gRPC :6158) ──────────────────
  saga-orchestrator-service:
    build:
      context: ./saga-orchestrator-service
      dockerfile: Dockerfile
    container_name: saga-orchestrator-service
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "${SAGA_ORCHESTRATOR_PORT:-6058}:6058"
      - "${SAGA_ORCHESTRATOR_GRPC_PORT:-6158}:6158"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6058/saga-orchestrator-service/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  mongodb_data:
  mysql_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  loki_data:
  grafana_data:
